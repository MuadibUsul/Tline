name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure www redirect
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            CADDY_CONTAINER=$(docker ps --filter ancestor=caddy:2-alpine --format '{{.ID}}' | head -n 1)
            CADDYFILE=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}' "$CADDY_CONTAINER")
            if ! grep -q '^www\.tlines\.tech {' "$CADDYFILE"; then
              cp "$CADDYFILE" "$CADDYFILE.bak"
              trap 'mv "$CADDYFILE.bak" "$CADDYFILE"' EXIT
              cat >> "$CADDYFILE" <<'EOF'

            www.tlines.tech {
                redir https://tlines.tech{uri} permanent
            }
            EOF
              docker exec "$CADDY_CONTAINER" caddy validate --config /etc/caddy/Caddyfile
              docker exec "$CADDY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile
              rm "$CADDYFILE.bak"
              trap - EXIT
            fi
      - name: Upload Compose configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml,docker-compose.prod.yml
          target: ~/tline
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd ~/tline
            mkdir -p backups
            IMAGE='${{ needs.build.outputs.image }}'
            NEW_TAG='${{ needs.build.outputs.tag }}'
            PREVIOUS_TAG=$(cat .deploy-tag 2>/dev/null || true)
            export TAG="$NEW_TAG"

            # The image is private. This token dies with the workflow run, so the host
            # never holds a lasting registry credential.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            # A schema migration can outlive Compose's dependency wait. Keep the app
            # running and let the explicit gate below decide, instead of aborting before
            # diagnostics and rollback can run.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d || true

            for i in $(seq 1 18); do
              RESEARCH_HEALTH=$(docker inspect "$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q scheduler)" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null || true)
              MACRO_HEALTH=$(docker inspect "$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q macro-scheduler)" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null || true)
              if [ "$RESEARCH_HEALTH" = healthy ] && [ "$MACRO_HEALTH" = healthy ] && docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app \
                node -e "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"; then
                echo "$NEW_TAG" > .deploy-tag

                # Retain the three most recent images: the one now running, the rollback
                # target, and one spare. Every deploy leaves behind a fully tagged image,
                # and `docker image prune` only removes DANGLING ones, so nothing here is
                # ever untagged and nothing was ever reclaimed. Measured cost of skipping
                # this: 22 stale images, 31.8 GB.
                #
                # Not `prune -af`: other projects share this host and -a would delete their
                # rollback images too. `prune` has no reference filter, so scoping to one
                # repository requires listing and removing explicitly. Plain `docker rmi`
                # (no -f) refuses an image that is in use, which is the safety net.
                docker image ls --filter=reference="${IMAGE}:sha-*" --format '{{.ID}} {{.CreatedAt}}' \
                  | sort -k2 -r \
                  | tail -n +4 \
                  | awk '{print $1}' \
                  | xargs -r docker rmi || true

                echo "Deployment is healthy"
                exit 0
              fi
              sleep 5
            done

            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=200 app || true

            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Deployment unhealthy; rolling back to $PREVIOUS_TAG"
              export TAG="$PREVIOUS_TAG"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            else
              echo "Deployment unhealthy; no previous successful tag is available"
            fi
            exit 1
