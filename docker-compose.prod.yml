# Cap container logs. The json-file driver keeps every line forever by default, so a
# chatty or crash-looping container can quietly fill the disk — 30 MB per container here,
# instead of unbounded. Takes effect when a container is recreated.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    mem_limit: 512m
    logging: *default-logging
    command: >-
      postgres -c shared_buffers=128MB -c effective_cache_size=384MB
      -c max_connections=50 -c work_mem=4MB

  app:
    image: ghcr.io/muadibusul/tline:${TAG:-latest}
    build: !reset null
    container_name: tline-app
    mem_limit: 1g
    logging: *default-logging
    environment:
      NODE_OPTIONS: --max-old-space-size=768
      SITE_URL: ${SITE_URL:?Set SITE_URL}
      NEXTAUTH_URL: ${SITE_URL:?Set SITE_URL}
      AUTH_PROVIDER: email
      EMAIL_SERVER: ${EMAIL_SERVER:?Set EMAIL_SERVER}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      # The app is reachable only through the Caddy service on the private web network.
      TRUST_PROXY_HEADERS: "true"
      HEALTH_DETAIL_TOKEN: ${HEALTH_DETAIL_TOKEN:?Set HEALTH_DETAIL_TOKEN}
    networks:
      - default
      - web

  scheduler:
    image: ghcr.io/muadibusul/tline:${TAG:-latest}
    build: !reset null
    mem_limit: 1g
    logging: *default-logging

  macro-scheduler:
    image: ghcr.io/muadibusul/tline:${TAG:-latest}
    build: !reset null
    mem_limit: 384m
    logging: *default-logging

  backup:
    image: ghcr.io/muadibusul/tline:${TAG:-latest}
    mem_limit: 384m
    logging: *default-logging
    restart: unless-stopped
    command: ["sh", "-c", "while true; do npm run backup; sleep 86400; done"]
    environment:
      DATABASE_URL: postgresql://tline:${POSTGRES_PASSWORD}@db:5432/tline
      DOCUMENT_STORAGE_ROOT: /app/storage
      BACKUP_DIR: /app/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
    volumes:
      - document-storage:/app/storage:ro
      - ${BACKUP_ROOT:-./backups}:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /app/backups -mindepth 2 -maxdepth 2 -name manifest.json -mmin -2160 -print -quit | grep -q ."]
      interval: 1h
      timeout: 5s
      start_period: 10m
      retries: 2

networks:
  web:
    external: true
