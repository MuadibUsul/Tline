# Operator commands that need a shell on the production host.
#
# Enrolment and password recovery both go through email. When the mail service fails,
# the only way back into an account is a command on the server — which is exactly what
# an operator who is locked out may have no way to run. This exposes the two commands
# that resolve that, using the SSH credentials the deployment already holds, so they can
# be triggered from a browser. The same door also runs occasional data-maintenance
# commands that need the production database (e.g. dedupe-regional), which are dry-run
# unless their apply box is checked.
#
# Deliberately narrow: a fixed set of actions, no free-form command, manual trigger only.
name: Operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run on the production host"
        type: choice
        required: true
        default: diagnose-mail
        options:
          - diagnose-mail
          - set-password
          - dedupe-regional
          - macro-analyze
          - consensus-license
          - macro-repair
          - social-diagnose
      email:
        description: "Account email address (for diagnose-mail / set-password)"
        type: string
        required: false
      apply:
        description: "dedupe-regional only: actually merge & delete (unchecked = dry-run)"
        type: boolean
        required: false
        default: false

concurrency:
  group: ops-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Inherits whatever protection rules the production environment carries, so this is
    # never a weaker door into the host than a deployment is.
    environment: production
    steps:
      - name: Validate the address
        if: inputs.action == 'diagnose-mail' || inputs.action == 'set-password'
        env:
          EMAIL: ${{ inputs.email }}
        run: |
          set -eu
          # The address reaches a shell on the host. Constrain it to the characters an
          # address can contain, so nothing else can ride along inside it.
          case "$EMAIL" in
            *[!A-Za-z0-9@._+-]*|*' '*|'') echo "Not a valid email address."; exit 1 ;;
          esac
          case "$EMAIL" in *@*.*) ;; *) echo "Not a valid email address."; exit 1 ;; esac
          echo "Address accepted."

      - name: Run on the production host
        uses: appleboy/ssh-action@v1
        env:
          ACTION: ${{ inputs.action }}
          EMAIL: ${{ inputs.email }}
          APPLY: ${{ inputs.apply }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ACTION,EMAIL,APPLY
          script: |
            set -eu
            cd ~/tline
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            case "$ACTION" in
              diagnose-mail)
                # Prints what the mail server itself says. The script redacts the password
                # inside EMAIL_SERVER before printing it, so the transcript carries the
                # diagnosis without the credential.
                $COMPOSE exec -T app npm run mail:test -- --to="$EMAIL"
                ;;
              set-password)
                echo "The generated password is printed below and appears in this log."
                echo "Sign in with it, then change it immediately at /account/password."
                echo ""
                $COMPOSE exec -T app npm run user:password -- --email="$EMAIL"
                ;;
              dedupe-regional)
                # Merge reports the same publication reached at more than one URL (e.g. a
                # State Street report syndicated across regional sites). Dry-run by default;
                # only writes when the 'apply' box was checked.
                if [ "$APPLY" = "true" ]; then
                  echo "Applying: duplicate reports will be merged and deleted."
                  $COMPOSE exec -T app npm run dedupe:regional -- --apply
                else
                  echo "Dry-run — nothing is written. Check the 'apply' box to merge."
                  $COMPOSE exec -T app npm run dedupe:regional
                fi
                ;;
              macro-analyze)
                # Regenerates missing bilingual read-outs for releases that already
                # captured values but whose one-shot inline analysis failed at capture.
                # Respects the retry/backoff bookkeeping, so it is cheap when nothing
                # is due and safe to click after any release that shows no analysis.
                $COMPOSE exec -T app npm run macro:forecasts -- --analyze
                ;;
              social-diagnose)
                # Read-only account of why a review card did or did not reach the group:
                # Feishu configuration completeness, accounts, routes, the last drafts with
                # their notification state, and the social audit trail. Prints no secrets.
                $COMPOSE exec -T app npm run social:diagnose
                ;;
              macro-repair)
                # Fills in a previous value the capture could not resolve — an event release
                # captured before this rule existed, or a source that carried no history —
                # and clears the read-outs written without it, so the analysis pass that
                # follows regenerates them. Listing first: the count is what says whether
                # anything is missing at all.
                $COMPOSE exec -T app npm run macro:repair
                if [ "$APPLY" = "true" ]; then
                  $COMPOSE exec -T app npm run macro:repair -- --apply
                  $COMPOSE exec -T app npm run macro:forecasts -- --analyze
                else
                  echo "Dry-run — nothing written. Check the 'apply' box to fill these in."
                fi
                ;;
              consensus-license)
                # The consensus feed is an external publisher's calendar data, so the
                # licence gate stays closed until an operator records the decision here.
                # Printing first makes the current state part of the transcript; the
                # uses are listed in the workflow so a change to them is reviewable.
                $COMPOSE exec -T app npm run licenses
                if [ "$APPLY" = "true" ]; then
                  echo "Recording the confirmation for the consensus calendar feed."
                  $COMPOSE exec -T app npm run licenses -- confirm \
                    --dataset=forexfactory:calendar \
                    --provider="ForexFactory calendar feed" \
                    --uses=internal_analysis,public_display,social \
                    --evidence-url=https://nfs.faireconomy.media/ff_calendar_thisweek.json \
                    --by=operator --apply
                else
                  echo "Dry-run — nothing recorded. Check the 'apply' box to confirm the licence."
                fi
                ;;
              *)
                echo "Unknown action: $ACTION"
                exit 1
                ;;
            esac
