services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tline
      POSTGRES_USER: tline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tline -d tline"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tline:${POSTGRES_PASSWORD}@db:5432/tline
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      SITE_URL: ${SITE_URL:-}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-common}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}
      ALLOW_INSECURE_DEMO_AUTH: ${ALLOW_INSECURE_DEMO_AUTH:-false}
      DOCUMENT_STORAGE_DRIVER: ${DOCUMENT_STORAGE_DRIVER:-local}
      DOCUMENT_STORAGE_ROOT: /app/storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_PREFIX: ${S3_PREFIX:-tline}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HEALTH_DETAIL_TOKEN: ${HEALTH_DETAIL_TOKEN:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_APPROVER_OPEN_IDS: ${FEISHU_APPROVER_OPEN_IDS:-}
    volumes:
      - document-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "npm run env:check:production && npm run scheduler"]
    environment:
      DATABASE_URL: postgresql://tline:${POSTGRES_PASSWORD}@db:5432/tline
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      SITE_URL: ${SITE_URL:?Set SITE_URL}
      DOCUMENT_STORAGE_DRIVER: ${DOCUMENT_STORAGE_DRIVER:-local}
      DOCUMENT_STORAGE_ROOT: /app/storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_PREFIX: ${S3_PREFIX:-tline}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      INGEST_INTERVAL_MS: ${INGEST_INTERVAL_MS:-60000}
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-2}
      INGEST_SOURCE_SECONDS: ${INGEST_SOURCE_SECONDS:-90}
      REPARSE_CONCURRENCY: ${REPARSE_CONCURRENCY:-2}
      TRANSLATION_CONCURRENCY: ${TRANSLATION_CONCURRENCY:-2}
      # Reports first ingested before the Chinese-completeness cutoff are not translated by
      # the automatic pass, so their /zh address renders the publisher's English and stays
      # out of the index. Set this to a batch size to sweep them, then back to 0. The sweep
      # is idempotent — it selects rows whose prompt, glossary or source hash has moved on —
      # so a tick with nothing stale spends nothing.
      TRANSLATION_BACKLOG_LIMIT: ${TRANSLATION_BACKLOG_LIMIT:-0}
      INGEST_ARTICLE_LIMIT: ${INGEST_ARTICLE_LIMIT:-4}
      INGEST_WINDOW_HOURS: ${INGEST_WINDOW_HOURS:-168}
      INGEST_STALL_HOURS: ${INGEST_STALL_HOURS:-6}
      VIEW_STALL_HOURS: ${VIEW_STALL_HOURS:-12}
      JOB_RETRY_LIMIT: ${JOB_RETRY_LIMIT:-3}
      JOB_RETRY_DELAY_MS: ${JOB_RETRY_DELAY_MS:-60000}
      JOB_FAILURE_WEBHOOK_URL: ${JOB_FAILURE_WEBHOOK_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - document-storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/check-worker-health.mjs", "research"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  macro-scheduler:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "npm run env:check:production && npm run macro:scheduler"]
    environment:
      DATABASE_URL: postgresql://tline:${POSTGRES_PASSWORD}@db:5432/tline
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      SITE_URL: ${SITE_URL:?Set SITE_URL}
      BLS_API_KEY: ${BLS_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      FRED_DATA_USE_CONFIRMED: ${FRED_DATA_USE_CONFIRMED:-false}
      EIA_API_KEY: ${EIA_API_KEY:-}
      MACRO_CALENDAR_INTERVAL_MS: ${MACRO_CALENDAR_INTERVAL_MS:-21600000}
      MACRO_PROVIDER_SYNC_INTERVAL_MS: ${MACRO_PROVIDER_SYNC_INTERVAL_MS:-3600000}
      MACRO_RELEASE_WATCH_INTERVAL_MS: ${MACRO_RELEASE_WATCH_INTERVAL_MS:-10000}
      MACRO_REVISION_SYNC_INTERVAL_MS: ${MACRO_REVISION_SYNC_INTERVAL_MS:-86400000}
      MACRO_POLICY_SYNC_INTERVAL_MS: ${MACRO_POLICY_SYNC_INTERVAL_MS:-21600000}
      MACRO_ALERT_INTERVAL_MS: ${MACRO_ALERT_INTERVAL_MS:-60000}
      MACRO_JOB_RETRY_LIMIT: ${MACRO_JOB_RETRY_LIMIT:-3}
      MACRO_JOB_RETRY_DELAY_MS: ${MACRO_JOB_RETRY_DELAY_MS:-30000}
      JOB_FAILURE_WEBHOOK_URL: ${JOB_FAILURE_WEBHOOK_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      TWELVE_DATA_QUALITY: ${TWELVE_DATA_QUALITY:-DELAYED}
      MACRO_MARKET_SYNC_INTERVAL_MS: ${MACRO_MARKET_SYNC_INTERVAL_MS:-1800000}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/check-worker-health.mjs", "macro"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  social-scheduler:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "npm run env:check:production && npm run social:scheduler"]
    environment:
      DATABASE_URL: postgresql://tline:${POSTGRES_PASSWORD}@db:5432/tline
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      SITE_URL: ${SITE_URL:?Set SITE_URL}
      DOCUMENT_STORAGE_ROOT: /app/storage
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REVIEW_RECEIVE_ID: ${FEISHU_REVIEW_RECEIVE_ID:-}
      FEISHU_REVIEW_RECEIVE_ID_TYPE: ${FEISHU_REVIEW_RECEIVE_ID_TYPE:-open_id}
      SOCIAL_INTERVAL_MS: ${SOCIAL_INTERVAL_MS:-5000}
      SOCIAL_PUBLISH_ATTEMPTS: ${SOCIAL_PUBLISH_ATTEMPTS:-6}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/check-worker-health.mjs", "social"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres-data:
  document-storage:
