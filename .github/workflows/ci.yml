name: CI

on:
  workflow_call:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Self-hosted: a private repository's Actions minutes are metered and shared with every
    # other private repository on the account, and this project's own usage was around
    # eleven billed minutes per push to main. Nothing here needs GitHub's machine — it is
    # npm ci, a typecheck, a lint and the test suite — and running it on the host the
    # release already runs on costs nothing. The timeout keeps a PR from hanging behind an
    # offline runner.
    runs-on: [self-hosted, tline]
    timeout-minutes: 30
    env:
      # Schema generation only needs a syntactically valid URL.
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-used-outside-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Prepare CI database
        run: npx prisma db push --accept-data-loss
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      # There was a `npm run build` here as well. It was the same build the Dockerfile runs
      # a few minutes later, on a machine that has to be paid for, and the release cannot
      # proceed if either one fails — so it was a second bill for the same answer. The
      # Docker build is the build gate now.
